# MySQL. Versions 5.7 and up are supported.
#
# Install the mysql2 driver:
#   gem install mysql2
#
# Configure Using Gemfile
# gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "mysql") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: inertia_development

test:
  <<: *default
  database: inertia_test

# Production reads its connection info from Rails' encrypted credentials
# (config/credentials.yml.enc, decrypted via RAILS_MASTER_KEY) instead of
# plain environment variables — the only production secret passed in
# directly is RAILS_MASTER_KEY itself. Explicit host/username/password
# here (rather than relying on the `default` block's ENV-based ones) also
# means production can never accidentally inherit dev/test's connection
# info, or vice versa.
production:
  <<: *default
  database: inertia_production
  host: <%= Rails.application.credentials.dig(:database, :host) %>
  port: <%= Rails.application.credentials.dig(:database, :port) %>
  username: <%= Rails.application.credentials.dig(:database, :username) %>
  password: <%= Rails.application.credentials.dig(:database, :password) %>
