# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: inertia_development

test:
  <<: *default
  database: inertia_test

# Production gets a single DATABASE_URL (e.g. from the hosting platform)
# instead of discrete host/user/password. It's kept separate from
# development/test on purpose: a url's embedded database name silently
# overrides the `database:` key above, and it must never be allowed to make
# test/development point at the same physical database.
production:
  <<: *default
  database: inertia_production
  url: <%= ENV["DATABASE_URL"] %>
