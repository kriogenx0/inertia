# This app's nginx vhost — copied to /etc/nginx/sites-available/inertia.it.com
# by deploy/deploy.sh (see that script), which also renders __HOST_PORT__
# into the real port before copying. Follows ~/Sites/server-config's
# Conventions for per-app deploy scripts: includes the shared snippets so
# certbot never has to edit this file directly (always --webroot mode).
#
# No /cable location: app/channels is unused rails-new boilerplate, nothing
# in the app actually uses ActionCable (see config/cable.yml). Real-time
# document collaboration is a separate service (Yjs/Hocuspocus, see
# collab-server/) reverse-proxied below at /collab/ — its own WebSocket
# traffic, unrelated to ActionCable.
#
# Requires a cert to already exist at the paths below — deploy.sh installs
# inertia.it.com.bootstrap.conf (HTTP-only) first on a domain that doesn't
# have one yet, requests the cert, then swaps to this file.
server {
    listen 80;
    listen [::]:80;
    server_name inertia.it.com www.inertia.it.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inertia.it.com www.inertia.it.com;

    ssl_certificate /etc/letsencrypt/live/inertia.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inertia.it.com/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/inertia.it.com/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:__HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rails/active_storage/ {
        proxy_pass http://127.0.0.1:__HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collab/ {
        proxy_pass http://127.0.0.1:__COLLAB_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived WebSocket connection — nginx's 60s default read timeout
        # would otherwise cut it off between edits.
        proxy_read_timeout 300s;
    }

    # webpack's build output is flat (no assets/ subdirectory — see
    # frontend/webpack.config.js) with content-hashed filenames for
    # everything except index.html, so it's safe to long-cache anything
    # matching these extensions instead of a directory prefix.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
