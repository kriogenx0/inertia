# Production stack for the app droplet — the Rails API plus the real-time
# collaboration service. No `db`/`mysql` service (the database is a
# DigitalOcean managed MySQL cluster, not co-located with the app) and no
# `frontend` service (nginx serves the webpack build copied by deploy.sh).
# No `redis` either: Inertia's ActionCable setup is unused generator
# boilerplate (no real-time features built on it), so config/cable.yml's
# production adapter is `async`, not `redis` — nothing in production needs
# Redis. Document collaboration (below) is a separate Node/Hocuspocus
# service, not ActionCable.
#
# Deployed via this repo's own deploy/deploy.sh, which manages nginx/certbot
# and this file's .env on the host — see that script and this repo's own
# README "Deploy" section. Mirrors ~/Sites/pocketproducer-web's pattern:
# GitHub Actions builds the image and streams it to `docker load` on the
# server before deploy.sh runs.
#
# The only secret in that .env is RAILS_MASTER_KEY. Everything else
# (secret_key_base, jwt_secret_key, the database host/port/username/
# password) lives in the committed, encrypted config/credentials.yml.enc —
# RAILS_MASTER_KEY is just what decrypts it at boot.
services:
  api:
    image: inertia-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
    ports:
      - "127.0.0.1:${HOST_PORT}:3000"
    volumes:
      - storage:/rails/storage
      - log:/rails/log

  # Real-time collaborative editing (Yjs/Hocuspocus) — see collab-server/'s
  # own README-equivalent header comments. Holds no secrets of its own:
  # onAuthenticate delegates both auth and authorization to `api`'s own
  # GET /api/v1/documents/:id, so there's no env_file here.
  collab:
    image: inertia-collab:latest
    restart: unless-stopped
    environment:
      RAILS_INTERNAL_URL: http://api:3000
      PORT: "1234"
    ports:
      - "127.0.0.1:${COLLAB_PORT}:1234"
    depends_on:
      - api

volumes:
  storage:
  log:
