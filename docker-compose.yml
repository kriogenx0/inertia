name: inertia

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres/inertia_development
      REDIS_URL: redis://redis:6379
      RAILS_ENV: development
      JWT_SECRET_KEY: dev_secret_change_in_production
      CORS_ORIGINS: http://localhost:5174
      BYPASS_AUTH: "true"
    volumes:
      - ./api:/rails
      - api_bundle:/usr/local/bundle

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inertia_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_BYPASS_AUTH: "true"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  api_bundle:
  app_node_modules:
