name: CI

# Moved here from backend/.github/workflows/ci.yml, which GitHub Actions
# never actually discovered — it only reads workflows from the repo root's
# .github/workflows, not a nested one. That old version also never ran the
# test suite at all (just brakeman + rubocop); this one does, folding those
# two checks in as their own jobs alongside real backend and frontend runs.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # mysql2's native extension needs these headers to compile — the bare
      # ubuntu-latest runner doesn't have them, unlike our Docker image
      # (which installs default-libmysqlclient-dev in its own base stage).
      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
          working-directory: backend

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run full Rails test suite
        run: bin/rails test

  brakeman:
    name: Security scan (Brakeman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
          working-directory: backend
      - run: bin/brakeman --no-pager

  rubocop:
    name: Lint (Rubocop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
          working-directory: backend
      - run: bin/rubocop -f github

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --force

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
