#   gem 'sqlite3'
creds: &creds
  #adapter: postgresql
  #host: localhost
  #user: admin
  #passowrd: admin

  adapter: mysql2
  host: 127.0.0.1
  user: root
  password:

development:
  adapter: mysql2
  host: 127.0.0.1
  user: root
  password:
  database: inertia_dev

